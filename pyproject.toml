# Métadonnées du package Python. Le script de release synchronise cette
# version avec mouvair_api.__version__, utilisée par les métadonnées HTTP de l’API.
[project]
name = "mouvair-back"
version = "0.4.1"
description = "Indice horaire des conditions extérieures pour quatre activités sportives"
requires-python = ">=3.12,<4.0"
# Dépendances d’exécution épinglées. Les outils de test sont séparés dans l’extra dev.
# httpx et redis assurent les accès asynchrones ; tzdata fournit les fuseaux IANA
# notamment sur les systèmes dépourvus de base de fuseaux, comme Windows.
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "redis==8.1.0",
    "tzdata==2026.6",
    "uvicorn[standard]==0.54.0",
]

# uv sync --locked --extra dev ajoute les outils du même verrou au package éditable.
[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

# Le constructeur est lui aussi épinglé, y compris dans l’environnement de build isolé.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

# Le poste local, Docker et la CI utilisent le même format et le même moteur de verrouillage.
[tool.uv]
required-version = "==0.13.6"

# Le layout src évite de confondre les sources Python avec les fichiers à la racine.
[tool.setuptools.packages.find]
where = ["src"]

# Pytest importe les sources et le script de release ; la découverte reste limitée aux tests.
# Les tests Redis restent ignorés tant que TEST_REDIS_URL n’est pas configurée.
[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
    "redis_integration: nécessite une instance Redis réelle configurée par TEST_REDIS_URL",
]

# Ruff vérifie la syntaxe compatible Python 3.12 et la longueur des lignes.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

# E/F : erreurs et symboles ; I : imports ; B : pièges ; UP : modernisation ; SIM : simplicité.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
