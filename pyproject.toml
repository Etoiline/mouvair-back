# Métadonnées du package installé par pip. Le script de release synchronise cette
# version avec mouvair_api.__version__, utilisée par les métadonnées HTTP de l’API.
[project]
name = "mouvair-back"
version = "0.4.0"
description = "Indice horaire des conditions extérieures pour quatre activités sportives"
requires-python = ">=3.12,<4.0"
# Dépendances d’exécution épinglées. Les outils de test sont séparés dans l’extra dev.
# httpx et redis assurent les accès asynchrones ; tzdata fournit les fuseaux IANA
# notamment sur les systèmes dépourvus de base de fuseaux, comme Windows.
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "redis==8.1.0",
    "tzdata==2026.3",
    "uvicorn[standard]==0.52.4",
]

# pip install -e ".[dev]" ajoute les tests et le contrôle statique au package éditable.
[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.16,<0.18",
]

# Setuptools construit le package ; aucune étape frontend n’est nécessaire au backend.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Le layout src évite de confondre les sources Python avec les fichiers à la racine.
[tool.setuptools.packages.find]
where = ["src"]

# Pytest importe directement les sources et limite la découverte au dossier tests.
# Les tests Redis restent ignorés tant que TEST_REDIS_URL n’est pas configurée.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "redis_integration: nécessite une instance Redis réelle configurée par TEST_REDIS_URL",
]

# Ruff vérifie la syntaxe compatible Python 3.12 et la longueur des lignes.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

# E/F : erreurs et symboles ; I : imports ; B : pièges ; UP : modernisation ; SIM : simplicité.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
