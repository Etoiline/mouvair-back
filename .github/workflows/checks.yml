name: Backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

# La vérification n’écrit ni dans le dépôt ni dans les services de production.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff and tests with Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Même image Redis que Compose, dans un conteneur éphémère du job.
    services:
      redis:
        image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # La variable active les tests Redis ; une connexion impossible fait échouer la suite.
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      # Les SHA fixent les versions vérifiées des actions, même si leurs tags évoluent.
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Une divergence entre pyproject.toml et le verrou échoue au lieu de résoudre à nouveau.
      - name: Install backend and development tools
        run: uv sync --locked --extra dev

      - name: Check Python with Ruff
        run: uv run --locked --extra dev ruff check .

      - name: Run all tests including Redis integration
        run: uv run --locked --extra dev pytest --strict-markers -ra
